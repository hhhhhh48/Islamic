<link rel="stylesheet" href="style.css">
<style>
.adhkar-hero{text-align:center;padding:3rem 1rem 2rem;position:relative;z-index:2}
.adhkar-hero .arabesque{font-family:var(--f-q);font-size:2rem;color:var(--au500);opacity:.7;margin-bottom:1rem}
.adhkar-hero h1{font-family:var(--f-d);font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:700;background:linear-gradient(135deg,var(--g700),var(--au500));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.adhkar-hero p{font-family:var(--f-l);font-size:.85rem;color:var(--i400);direction:ltr}
.adhkar-hero .subtitle-ar{font-family:var(--f-q);font-size:1.05rem;color:var(--i600);margin-top:1rem;line-height:1.9;max-width:640px;margin-left:auto;margin-right:auto}
[data-theme="dark"] .adhkar-hero .subtitle-ar{color:var(--i400)}

.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.4rem;margin-bottom:2rem;background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-pill);backdrop-filter:blur(20px);position:sticky;top:1rem;z-index:40;box-shadow:var(--sh-md);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:.7rem 1.3rem;background:transparent;border:none;border-radius:var(--r-pill);font-family:var(--f-b);font-size:.88rem;font-weight:600;color:var(--i500);cursor:pointer;transition:all .3s var(--e);white-space:nowrap}
.tab:hover{background:var(--i100);color:var(--i800)}
.tab.active{background:linear-gradient(135deg,var(--g600),var(--g700));color:#fff;box-shadow:0 8px 20px rgba(45,106,79,.25)}
[data-theme="dark"] .tab.active{background:linear-gradient(135deg,var(--g500),var(--g700))}

.section-title{font-family:var(--f-d);font-size:1.2rem;color:var(--g800);margin:2rem 0 1rem;padding-right:1rem;border-right:4px solid var(--au500);font-weight:600}
[data-theme="dark"] .section-title{color:var(--g300)}

.dhikr-grid{display:flex;flex-direction:column;gap:.9rem}
.dhikr-card{background:var(--paper);backdrop-filter:blur(20px);border:1px solid var(--i200);border-radius:var(--r-m);padding:1.3rem 1.4rem;transition:all .3s var(--e);position:relative}
[data-theme="dark"] .dhikr-card{border-color:rgba(82,183,136,.12)}
.dhikr-card:hover{border-color:var(--g300);box-shadow:0 8px 24px rgba(13,40,24,.06);transform:translateY(-2px)}
.dhikr-text{font-family:var(--f-q);font-size:clamp(1.05rem,3.2vw,1.3rem);color:var(--g800);line-height:2;margin-bottom:.7rem;direction:rtl;text-align:right}
[data-theme="dark"] .dhikr-text{color:var(--g200)}
.dhikr-meta{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--i500);padding-top:.7rem;border-top:1px dashed var(--i200)}
[data-theme="dark"] .dhikr-meta{border-top-color:var(--i300)}
.dhikr-fadl{flex:1;font-family:var(--f-b);font-size:.82rem;color:var(--au600);font-weight:600}
[data-theme="dark"] .dhikr-fadl{color:var(--au400)}
.dhikr-count{font-family:var(--f-l);font-weight:700;color:var(--g600);background:var(--g50);padding:.3rem .8rem;border-radius:var(--r-pill);font-size:.78rem;direction:ltr}
[data-theme="dark"] .dhikr-count{background:rgba(82,183,136,.12);color:var(--g300)}

.back-bar{display:flex;justify-content:center;margin:2rem 0 3rem}
.back-btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.8rem;background:linear-gradient(135deg,var(--g600),var(--g700));color:#fff;text-decoration:none;border-radius:var(--r-pill);font-family:var(--f-b);font-size:.95rem;font-weight:600;box-shadow:0 12px 30px rgba(45,106,79,.3);transition:all .4s var(--e)}
.back-btn:hover{transform:translateY(-3px)}
.back-btn svg{width:18px;height:18px}
</style>

<button class="theme-toggle" id="themeToggle">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

</button>

<main class="container">

  <h1 data-i18n="adhkar_title">أذكار وأدعية يومية</h1>
  <p>Daily Adhkar & Supplications</p>
  <p class="subtitle-ar" data-i18n="adhkar_subtitle">أذكار الصباح والمساء، وأدعية النوم والاستيقاظ، والطعام والسفر — مع فضل كل ذكر.</p>
</section>

<div class="tabs" id="tabs">
  <button class="tab active" data-cat="morning"><span data-i18n="tab_morning">🌅 الصباح</span></button>
  <button class="tab" data-cat="evening"><span data-i18n="tab_evening">🌙 المساء</span></button>
  <button class="tab" data-cat="sleep"><span data-i18n="tab_sleep">😴 النوم</span></button>

    <span data-i18n="back_home">العودة للرئيسية</span>
  </a>
</div>
</main>

<div class="share-container"></div>

<footer class="footer">
  <div class="footer-dua">اللهم اجعل ألسنتنا رطبةً بذكرك</div>
  <div class="footer-owner">صاحب الموقع: <strong>واشمي محمد</strong></div>
</footer>

<script src="adhkar-data.js"></script>
<script>
(function(){
  const s=localStorage.getItem('theme');
  const d=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));
  document.getElementById('themeToggle').addEventListener('click',()=>{
    const c=document.documentElement.getAttribute('data-theme');
    const n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  });

  const content = document.getElementById('adhkarContent');
  const data = window.ADHKAR || {};

  function render(cat) {
    const section = data[cat];
    if (!section) { content.innerHTML = '<p style="text-align:center;color:var(--i400)">لا توجد أذكار</p>'; return; }
    let html = '';
    if (section.title) html += '<h3 class="section-title">' + section.title + '</h3>';
    html += '<div class="dhikr-grid">';
    section.items.forEach(d => {
      html += '<div class="dhikr-card">' +
        '<div class="dhikr-text">' + d.text + '</div>' +
        '<div class="dhikr-meta">' +
          '<span class="dhikr-fadl">' + (d.fadl || '') + '</span>' +
          (d.count ? '<span class="dhikr-count">' + d.count + '</span>' : '') +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    content.innerHTML = html;
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      render(t.dataset.cat);
    });
  });
  render('morning');
})();
</script>
<script src="share.js"></script>
