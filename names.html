<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b4332">
<title>أسماء الله الحسنى · 99 Names of Allah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.names-hero{text-align:center;padding:3rem 1rem 2rem;position:relative;z-index:2}
.names-hero .arabesque{font-family:var(--f-q);font-size:2rem;color:var(--au500);opacity:.7;margin-bottom:1rem}
.names-hero h1{font-family:var(--f-d);font-size:clamp(2rem,6vw,3rem);font-weight:700;color:var(--i900);letter-spacing:-.01em;margin-bottom:.5rem;background:linear-gradient(135deg,var(--g700),var(--au500));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.names-hero p{font-family:var(--f-l);font-size:.9rem;color:var(--i400);direction:ltr;letter-spacing:.05em}
.names-hero .subtitle-ar{font-family:var(--f-q);font-size:1.1rem;color:var(--i600);margin-top:1rem;line-height:1.9;max-width:600px;margin-left:auto;margin-right:auto}
[data-theme="dark"] .names-hero .subtitle-ar{color:var(--i400)}

.names-toolbar{position:sticky;top:0;z-index:50;background:var(--paper);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:1rem;margin-bottom:1.5rem;border-radius:var(--r-m);border:1px solid var(--i200);box-shadow:var(--sh-md);display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;justify-content:center}
[data-theme="dark"] .names-toolbar{border-color:rgba(82,183,136,.15)}
.names-search{flex:1;min-width:200px;padding:.7rem 1.2rem;background:var(--i100);border:1.5px solid transparent;border-radius:var(--r-pill);font-family:var(--f-b);font-size:.95rem;color:var(--i900);outline:none;transition:all .3s var(--e)}
[data-theme="dark"] .names-search{background:rgba(24,34,27,.5);color:#fff}
.names-search:focus{border-color:var(--g500);background:var(--paper);box-shadow:0 0 0 4px rgba(82,183,136,.15)}
.names-count{font-family:var(--f-l);font-size:.8rem;color:var(--g600);font-weight:600;padding:.4rem .9rem;background:var(--g50);border-radius:var(--r-pill);direction:ltr}

.names-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;position:relative;z-index:2;margin-bottom:3rem}
.name-card{background:var(--paper);backdrop-filter:blur(20px);border:1px solid var(--i200);border-radius:var(--r-m);padding:1.4rem 1.2rem;transition:all .4s var(--e);position:relative;overflow:hidden;cursor:pointer}
[data-theme="dark"] .name-card{border-color:rgba(82,183,136,.12)}
.name-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--au400),transparent);opacity:0;transition:opacity .4s var(--e)}
.name-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(13,40,24,.12);border-color:var(--au400)}
.name-card:hover::before{opacity:1}
[data-theme="dark"] .name-card:hover{box-shadow:0 20px 40px rgba(0,0,0,.4)}
.name-number{position:absolute;top:.7rem;left:.9rem;font-family:var(--f-l);font-size:.7rem;font-weight:700;color:var(--au500);background:var(--au200);padding:.15rem .5rem;border-radius:var(--r-pill);direction:ltr}
[data-theme="dark"] .name-number{background:rgba(201,169,97,.15);color:var(--au400)}
.name-arabic{font-family:var(--f-q);font-size:1.9rem;font-weight:700;color:var(--g800);text-align:center;margin-bottom:.6rem;line-height:1.4;letter-spacing:.02em}
[data-theme="dark"] .name-arabic{color:var(--g200)}
.name-translit{font-family:var(--f-l);font-size:.85rem;color:var(--au600);text-align:center;font-style:italic;margin-bottom:.5rem;direction:ltr;letter-spacing:.02em}
[data-theme="dark"] .name-translit{color:var(--au400)}
.name-meaning{font-size:.9rem;color:var(--i600);text-align:center;line-height:1.6;padding-top:.6rem;border-top:1px dashed var(--i200)}
[data-theme="dark"] .name-meaning{color:var(--i400);border-top-color:var(--i300)}
.name-meaning-en{font-family:var(--f-l);font-size:.8rem;color:var(--i400);text-align:center;direction:ltr;margin-top:.25rem;line-height:1.5}

.back-bar{display:flex;justify-content:center;margin-bottom:2rem;position:relative;z-index:2}
.back-btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.8rem;background:linear-gradient(135deg,var(--g600),var(--g700));color:#fff;text-decoration:none;border-radius:var(--r-pill);font-family:var(--f-b);font-size:.95rem;font-weight:600;box-shadow:0 12px 30px rgba(45,106,79,.3);transition:all .4s var(--e)}
.back-btn:hover{transform:translateY(-3px);box-shadow:0 20px 45px rgba(45,106,79,.4)}
.back-btn svg{width:18px;height:18px}

.names-footer{text-align:center;padding:2rem 1rem 4rem;color:var(--i400);font-size:.85rem;position:relative;z-index:2}
.names-footer .ayah{font-family:var(--f-q);font-size:1.2rem;color:var(--g700);margin-bottom:.8rem;line-height:1.9}
[data-theme="dark"] .names-footer .ayah{color:var(--g400)}
.names-footer .owner{margin-top:1.2rem;font-family:var(--f-d);color:var(--g700)}
[data-theme="dark"] .names-footer .owner{color:var(--g400)}
.names-footer .owner strong{color:var(--au600)}
[data-theme="dark"] .names-footer .owner strong{color:var(--au400)}

.no-results{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--i400);font-size:1rem}
@media (max-width:600px){
  .names-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
  .name-card{padding:1.1rem .9rem}
  .name-arabic{font-size:1.5rem}
}
</style>
</head>
<body>

<div class="lang-bar">
  <a href="index.html" style="text-decoration:none;padding:.6rem 1.1rem;background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-pill);color:var(--i800);font-family:var(--f-b);font-size:.85rem;font-weight:600;box-shadow:var(--sh-md);transition:all .3s var(--e)">🏠 الرئيسية</a>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="Theme">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>

<main class="container">
  <section class="names-hero">
    <div class="arabesque">❁ ✦ ❁</div>
    <h1 data-i18n="names_title">أسماء الله الحسنى</h1>
    <p>The 99 Beautiful Names of Allah</p>
    <p class="subtitle-ar" data-i18n="names_subtitle">﴿ وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا ﴾</p>
  </section>

  <div class="names-toolbar">
    <input type="text" class="names-search" id="namesSearch" data-i18n-placeholder="search_ph" placeholder="🔍 ابحث باسم...">
    <span class="names-count" id="namesCount">99 / 99</span>
  </div>

  <div class="names-grid" id="namesGrid"></div>

  <div class="back-bar">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-i18n="back_home">العودة للصفحة الرئيسية</span>
    </a>
  </div>
</main>

<div class="share-container"></div>

<footer class="names-footer">
  <div class="ayah">﴿ وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا ﴾</div>
  <div>الأعراف · 7:180</div>
  <div class="owner">صاحب الموقع: <strong>واشمي محمد</strong></div>
</footer>

<script src="names-data.js"></script>
<script>
(function(){
  // Theme
  const s=localStorage.getItem('theme');
  const d=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));
  document.getElementById('themeToggle').addEventListener('click',()=>{
    const c=document.documentElement.getAttribute('data-theme');
    const n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  });

  // Render names
  const grid = document.getElementById('namesGrid');
  const search = document.getElementById('namesSearch');
  const count = document.getElementById('namesCount');
  const names = window.NAMES_99 || [];

  function render(filter='') {
    const f = filter.trim().toLowerCase();
    const list = !f ? names : names.filter(n =>
      n.ar.includes(filter) ||
      n.tr.toLowerCase().includes(f) ||
      n.en.toLowerCase().includes(f)
    );
    count.textContent = list.length + ' / ' + names.length;
    if (!list.length) {
      grid.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة 🤍</div>';
      return;
    }
    grid.innerHTML = list.map((n, i) => {
      const idx = names.indexOf(n) + 1;
      return '<div class="name-card">' +
        '<div class="name-number">' + idx + '</div>' +
        '<div class="name-arabic">' + n.ar + '</div>' +
        '<div class="name-translit">' + n.tr + '</div>' +
        '<div class="name-meaning">' + n.ar_short + '</div>' +
        '<div class="name-meaning-en">' + n.en + '</div>' +
      '</div>';
    }).join('');
  }

  search.addEventListener('input', e => render(e.target.value));
  render();
})();
</script>
<script src="share.js"></script>
<script src="pages-i18n.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function(){
    window.injectLangSelector();
    window.applyPagesI18n();
  });
</script>
</body>
</html>
