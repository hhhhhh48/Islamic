.hh-hero{text-align:center;padding:3rem 1rem 2rem;position:relative;z-index:2;background:radial-gradient(circle at center,rgba(82,183,136,.10),transparent 70%);border-radius:var(--r-xl);margin-bottom:2rem}
.hh-hero h1{font-family:var(--f-d);font-size:clamp(1.9rem,5.5vw,3rem);font-weight:700;background:linear-gradient(135deg,var(--g700),var(--au500));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.hh-hero .en-sub{font-family:var(--f-l);font-size:.85rem;color:var(--i400);letter-spacing:.15em;direction:ltr;margin-bottom:1.5rem}
.hh-hero .verse{font-family:var(--f-q);font-size:clamp(1rem,2.7vw,1.2rem);color:var(--g800);line-height:2;max-width:720px;margin:0 auto 1rem;padding:1.3rem;background:var(--g50);border-radius:var(--r-m);border-right:4px solid var(--g500)}
[data-theme="dark"] .hh-hero .verse{background:rgba(82,183,136,.08);color:var(--g200)}
.hh-hero .intro{font-size:1rem;color:var(--i600);line-height:1.9;max-width:640px;margin:1rem auto 0}
[data-theme="dark"] .hh-hero .intro{color:var(--i500)}

.toc{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-l);padding:1.5rem;margin-bottom:2rem;box-shadow:var(--sh-md)}
[data-theme="dark"] .toc{border-color:rgba(82,183,136,.15)}
.toc-title{font-family:var(--f-d);font-size:1rem;color:var(--g700);margin-bottom:.8rem;font-weight:600}
.toc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.4rem}
.toc-list a{color:var(--i600);text-decoration:none;font-size:.88rem;padding:.4rem .7rem;border-radius:var(--r-s);transition:all .3s var(--e);display:block}
.toc-list a:hover{background:var(--g50);color:var(--g700)}

.sec{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-xl);padding:clamp(1.6rem,4.5vw,2.6rem);margin-bottom:1.8rem;box-shadow:var(--sh-md);scroll-margin-top:80px}
[data-theme="dark"] .sec{border-color:rgba(82,183,136,.12)}
.sec-title{font-family:var(--f-d);font-size:clamp(1.3rem,3.8vw,1.75rem);font-weight:700;color:var(--i900);margin-bottom:.5rem;line-height:1.35}
[data-theme="dark"] .sec-title{color:var(--g300)}
.sec-intro{font-size:1rem;color:var(--i600);line-height:1.9;margin-bottom:1.5rem;padding:.8rem 1rem;background:var(--i100);border-radius:var(--r-m);border-right:3px solid var(--au500)}
[data-theme="dark"] .sec-intro{background:rgba(82,183,136,.06);color:var(--i500)}

.dual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.haram-list{background:rgba(229,115,115,.06);border-radius:var(--r-m);padding:1.3rem;border:1.5px solid rgba(229,115,115,.25)}
.halal-list{background:rgba(82,183,136,.06);border-radius:var(--r-m);padding:1.3rem;border:1.5px solid rgba(82,183,136,.25)}
.list-title{font-family:var(--f-d);font-size:1.1rem;font-weight:700;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid rgba(0,0,0,.08)}
.haram-list .list-title{color:#c62828}
.halal-list .list-title{color:var(--g700)}
[data-theme="dark"] .halal-list .list-title{color:var(--g300)}

.list-item{padding:.7rem 1rem;background:var(--paper);border-radius:var(--r-s);margin-bottom:.5rem;font-size:.95rem;color:var(--i700);line-height:1.75;border-right:3px solid transparent;transition:all .2s var(--e)}
.list-item:hover{transform:translateX(-3px)}
.haram-list .list-item{border-right-color:#e57373}
.halal-list .list-item{border-right-color:var(--g500)}
[data-theme="dark"] .list-item{background:rgba(24,34,27,.6);color:var(--i500)}

.wisdom-box{margin-top:1.2rem;padding:1.2rem 1.5rem;background:linear-gradient(135deg,var(--au200),var(--au400));border-radius:var(--r-m);color:var(--g900)}
.wisdom-box .w-title{font-family:var(--f-d);font-weight:700;margin-bottom:.5rem;font-size:1.05rem}
.wisdom-box .w-text{font-size:.95rem;line-height:1.85}

.verse-box{background:linear-gradient(135deg,var(--g50),rgba(201,169,97,.06));border-right:4px solid var(--g500);border-radius:var(--r-m);padding:1.2rem 1.5rem;margin:1rem 0;font-family:var(--f-q);font-size:clamp(1rem,2.6vw,1.15rem);line-height:2;color:var(--g800)}
[data-theme="dark"] .verse-box{background:rgba(82,183,136,.08);color:var(--g200)}

.steps-list{list-style:none;padding:0;margin:1rem 0}
.steps-list li{padding:.9rem 1.2rem;background:var(--i100);border-radius:var(--r-m);margin-bottom:.6rem;font-size:.96rem;color:var(--i700);line-height:1.8;border-right:3px solid var(--g400);display:flex;gap:.8rem;align-items:flex-start}
[data-theme="dark"] .steps-list li{background:rgba(82,183,136,.05);color:var(--i500)}
.steps-list li::before{content:'✦';color:var(--au500);font-weight:700;flex-shrink:0}

.major-list{list-style:none;padding:0;counter-reset:major}
.major-list li{padding:.9rem 1.2rem;background:rgba(229,115,115,.06);border-right:4px solid #e57373;border-radius:var(--r-m);margin-bottom:.5rem;font-size:.95rem;color:#8b1a1a;line-height:1.8}
[data-theme="dark"] .major-list li{background:rgba(229,115,115,.12);color:#ffb3b3}

.hadith-box{margin-top:1.2rem;padding:1rem 1.3rem;background:var(--g800);color:#fff;border-radius:var(--r-m);font-family:var(--f-q);font-size:1.05rem;line-height:1.9;text-align:center}
.hadith-box .h-ref{display:block;font-family:var(--f-l);font-size:.75rem;color:var(--au400);margin-top:.5rem}

.final-note{background:linear-gradient(135deg,rgba(201,169,97,.15),rgba(201,169,97,.08));border:1.5px solid var(--au400);border-radius:var(--r-m);padding:1.2rem 1.5rem;margin-top:1.5rem;font-size:.92rem;color:var(--i700);line-height:1.8;text-align:center}
[data-theme="dark"] .final-note{color:var(--i500)}

.footer-dua{font-family:var(--f-q);font-size:1.1rem;color:var(--g700);margin-bottom:.8rem}
[data-theme="dark"] .footer-dua{color:var(--g400)}

@media(max-width:600px){
  .dual-grid{grid-template-columns:1fr}
}

/* ═══ Theme & Layout Overrides ═══ */
:root{ --f-body:'Tajawal',system-ui,sans-serif; }
body, p, li, .text, .card, .section { font-family: var(--f-body) !important; }
section, .container, .card { padding-left: 1.2rem; padding-right: 1.2rem; }
p, li { line-height: 1.9; margin-bottom: 1rem; }
.footnotes { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .9rem; color: var(--ink-3); }
.footnotes ol { padding-right: 1.2rem; }
.footnotes li { margin-bottom: .5rem; }
@media (max-width: 768px) {
  html { font-size: 15px; }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  .container { padding-left: 1rem; padding-right: 1rem; }
  .grid { grid-template-columns: 1fr !important; }
}
[data-theme="dark"] {
  --paper: #0f1f17;
  --bg: #0a1510;
  --bg-2: #12241b;
  --ink: #e8f0ec;

}
[data-theme="dark"] body { background: var(--bg); color: var(--ink); }
[data-theme="dark"] .card, [data-theme="dark"] section { background: var(--paper); border-color: var(--line); }

<script>
(function(){
  var s=localStorage.getItem('theme');
  var d=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));
  document.getElementById('themeToggle').addEventListener('click',function(){
    var c=document.documentElement.getAttribute('data-theme');
    var n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  });

  // language switcher
  var lang = localStorage.getItem('lang') || 'ar';
  if(lang !== 'ar' && lang !== 'en') lang = 'en';
  var bar = document.querySelector('.lang-bar');
  if(bar){
    var sel = document.createElement('select');
    sel.className = 'lang-select';
    var opts = {ar:'🇸🇦 العربية', en:'🇬🇧 English'};
    Object.keys(opts).forEach(function(c){
      var o = document.createElement('option');
      o.value = c; o.textContent = opts[c];
      if(c === lang) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){
      localStorage.setItem('lang', this.value);
      window.applyHalalI18n();
    });
    var firstA = bar.querySelector('a');
    if(firstA) bar.insertBefore(sel, firstA);
    else bar.appendChild(sel);
  }

  window.applyHalalI18n();

  // smooth TOC
  document.querySelectorAll('.toc-list a').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var t = document.querySelector(this.getAttribute('href'));
      if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
})();
</script>
