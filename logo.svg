      <stop offset="50%" stop-color="#c9a961" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a67c3c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- خلفية -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- نمط هندسي إسلامي -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.2" fill="none">
    <circle cx="100" cy="100" r="60"/>
    <circle cx="100" cy="100" r="40"/>
    <path d="M 100 40 L 160 100 L 100 160 L 40 100 Z"/>
    <path d="M 100 60 L 140 100 L 100 140 L 60 100 Z"/>
    
    <circle cx="1100" cy="100" r="60"/>
    <circle cx="1100" cy="100" r="40"/>
    <path d="M 1100 40 L 1160 100 L 1100 160 L 1040 100 Z"/>
    
    <circle cx="100" cy="530" r="60"/>
    <path d="M 100 470 L 160 530 L 100 590 L 40 530 Z"/>
    
    <circle cx="1100" cy="530" r="60"/>
    <path d="M 1100 470 L 1160 530 L 1100 590 L 1040 530 Z"/>
  </g>

  <!-- إطار ذهبي -->
  <rect x="25" y="25" width="1150" height="580" fill="none" stroke="#c9a961" stroke-width="2" rx="30"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#c9a961" stroke-width="1" stroke-dasharray="6,4" rx="22" opacity="0.5"/>

  <!-- البسملة -->
  <text x="600" y="130" font-family="Amiri, serif" font-size="52" fill="#e6c988" text-anchor="middle" font-weight="400">﷽</text>

  <!-- زخرفة علوية -->
