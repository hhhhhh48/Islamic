  <!-- نص البسملة -->
  <text x="512" y="540" font-family="Amiri, serif" font-size="70" fill="url(#goldGrad)" text-anchor="middle" font-weight="700">﷽</text>

  <!-- خط فاصل -->
  <line x1="300" y1="590" x2="420" y2="590" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="604" y1="590" x2="724" y2="590" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="512" cy="590" r="8" fill="url(#goldGrad)"/>

  <!-- العنوان العربي -->
  <text x="512" y="690" font-family="Amiri, serif" font-size="88" fill="url(#goldGrad)" text-anchor="middle" font-weight="700" letter-spacing="2">بيتك الجديد</text>

  <!-- العنوان الإنجليزي -->
  <text x="512" y="760" font-family="Inter, sans-serif" font-size="32" fill="#a3c9b0" text-anchor="middle" letter-spacing="14" font-weight="300">WELCOME HOME</text>

  <!-- الوصف -->
  <text x="512" y="810" font-family="Amiri, serif" font-size="24" fill="#c9a961" text-anchor="middle" opacity="0.85">۞ موقع إسلامي شامل ۞</text>

  <!-- الزخرفة السفلية -->
  <text x="512" y="870" font-family="Amiri, serif" font-size="26" fill="url(#goldGrad)" text-anchor="middle">❁ ❁ ❁</text>

  <!-- الرابط -->
  <text x="512" y="910" font-family="Inter, sans-serif" font-size="18" fill="#8a9691" text-anchor="middle" letter-spacing="2">www.mohammedouachemi.work.gd</text>
