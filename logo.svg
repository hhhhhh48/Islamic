    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4e4bc"/>
      <stop offset="50%" stop-color="#e6c988"/>
      <stop offset="100%" stop-color="#c9a961"/>
