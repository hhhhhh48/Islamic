    <path d="M 512 200 L 640 328 L 768 200 L 824 256 L 768 384 L 824 512 L 768 640 L 824 768 L 768 824 L 640 768 L 512 824 L 384 768 L 256 824 L 200 768 L 256 640 L 200 512 L 256 384 L 200 256 L 256 200 L 384 256 Z" opacity="0.3"/>
    <!-- دائرة داخلية -->
    <circle cx="512" cy="512" r="200"/>
    <circle cx="512" cy="512" r="260"/>
  </g>

  <!-- قوس القبة (المسجد) -->
  <g fill="url(#goldGrad)">
    <!-- القبة الكبيرة -->
    <path d="M 512 340 Q 512 280 562 270 Q 612 280 612 340 L 612 400 L 412 400 L 412 340 Q 412 280 462 270 Q 512 280 512 340 Z" opacity="0.95"/>
    <!-- الهلال على القبة -->
    <circle cx="512" cy="245" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <path d="M 512 220 Q 520 245 512 270" fill="url(#goldGrad)"/>
  </g>
  
  <!-- المآذن الجانبية -->
  <g fill="url(#goldGrad)">
    <rect x="340" y="380" width="24" height="180" rx="3"/>
    <ellipse cx="352" cy="375" rx="14" ry="10"/>
    <rect x="660" y="380" width="24" height="180" rx="3"/>
    <ellipse cx="672" cy="375" rx="14" ry="10"/>
