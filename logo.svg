  <circle cx="512" cy="512" r="500" fill="url(#glow)"/>
  
  <!-- حلقة ذهبية خارجية -->
  <circle cx="512" cy="512" r="480" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,8" opacity="0.6"/>

