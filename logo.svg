<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6c988"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c3c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a961" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a67c3c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- خلفية -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- نمط هندسي إسلامي -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.2" fill="none">
    <circle cx="100" cy="100" r="60"/>
    <circle cx="100" cy="100" r="40"/>
    <path d="M 100 40 L 160 100 L 100 160 L 40 100 Z"/>
    <path d="M 100 60 L 140 100 L 100 140 L 60 100 Z"/>
    
    <circle cx="1100" cy="100" r="60"/>
    <circle cx="1100" cy="100" r="40"/>
    <path d="M 1100 40 L 1160 100 L 1100 160 L 1040 100 Z"/>
    
    <circle cx="100" cy="530" r="60"/>
    <path d="M 100 470 L 160 530 L 100 590 L 40 530 Z"/>
    
    <circle cx="1100" cy="530" r="60"/>
    <path d="M 1100 470 L 1160 530 L 1100 590 L 1040 530 Z"/>
  </g>

  <!-- إطار ذهبي -->
  <rect x="25" y="25" width="1150" height="580" fill="none" stroke="#c9a961" stroke-width="2" rx="30"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#c9a961" stroke-width="1" stroke-dasharray="6,4" rx="22" opacity="0.5"/>

  <!-- البسملة -->
  <text x="600" y="130" font-family="Amiri, serif" font-size="52" fill="#e6c988" text-anchor="middle" font-weight="400">﷽</text>

  <!-- زخرفة علوية -->
  <line x1="300" y1="170" x2="500" y2="170" stroke="url(#goldLine)" stroke-width="1.5"/>
  <text x="600" y="180" font-family="Amiri, serif" font-size="28" fill="#c9a961" text-anchor="middle">۞</text>
  <line x1="700" y1="170" x2="900" y2="170" stroke="url(#goldLine)" stroke-width="1.5"/>

  <!-- العنوان العربي الرئيسي -->
  <text x="600" y="310" font-family="Amiri, serif" font-size="130" fill="url(#gold)" text-anchor="middle" font-weight="700">بيتك الجديد</text>

  <!-- العنوان الإنجليزي -->
  <text x="600" y="380" font-family="Inter, sans-serif" font-size="38" fill="#a3c9b0" text-anchor="middle" letter-spacing="12" font-weight="300">WELCOME HOME</text>

  <!-- خط فاصل -->
  <line x1="340" y1="425" x2="530" y2="425" stroke="url(#goldLine)" stroke-width="1.5"/>
  <text x="600" y="437" font-family="Amiri, serif" font-size="34" fill="#c9a961" text-anchor="middle">✦</text>
  <line x1="670" y1="425" x2="860" y2="425" stroke="url(#goldLine)" stroke-width="1.5"/>

  <!-- الوصف -->
  <text x="600" y="488" font-family="Inter, sans-serif" font-size="24" fill="#8a9691" text-anchor="middle" letter-spacing="1">موقع إسلامي شامل · Islamic Comprehensive Site</text>

  <!-- الرابط -->
  <text x="600" y="545" font-family="Inter, sans-serif" font-size="28" fill="#c9a961" text-anchor="middle" letter-spacing="3">www.mohammedouachemi.work.gd</text>

  <!-- زخرفة سفلية -->
  <text x="600" y="590" font-family="Amiri, serif" font-size="26" fill="#c9a961" text-anchor="middle" opacity="0.7">❁ ❁ ❁</text>
