<link rel="stylesheet" href="style.css">
<style>
.dz-hero{text-align:center;padding:3rem 1rem 2rem;position:relative;z-index:2;background:radial-gradient(circle at center,rgba(0,122,61,.15),transparent 70%);border-radius:var(--r-xl);margin-bottom:2rem}
.dz-flag-badge{display:inline-flex;align-items:center;justify-content:center;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#006233 50%,#fff 50%);margin-bottom:1rem;box-shadow:0 12px 32px rgba(0,98,51,.3);position:relative}
.dz-flag-badge::after{content:'☪';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);font-size:2rem;color:#D21034}
.dz-hero h1{font-family:var(--f-d);font-size:clamp(1.9rem,5.5vw,3rem);font-weight:700;background:linear-gradient(135deg,#006233,#D21034);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.dz-hero .en-sub{font-family:var(--f-l);font-size:.85rem;color:var(--i400);letter-spacing:.15em;direction:ltr;margin-bottom:1.5rem}
.dz-hero .verse{font-family:var(--f-q);font-size:clamp(1rem,2.7vw,1.2rem);color:var(--g800);line-height:2;max-width:720px;margin:0 auto 1rem;padding:1.3rem;background:var(--g50);border-radius:var(--r-m);border-right:4px solid #006233}
[data-theme="dark"] .dz-hero .verse{background:rgba(82,183,136,.08);color:var(--g200)}
.dz-hero .intro{font-size:1rem;color:var(--i600);line-height:1.9;max-width:640px;margin:1rem auto 0}
[data-theme="dark"] .dz-hero .intro{color:var(--i500)}

.sec{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-xl);padding:clamp(1.6rem,4.5vw,2.6rem);margin-bottom:1.8rem;box-shadow:var(--sh-md)}
[data-theme="dark"] .sec{border-color:rgba(82,183,136,.12)}
.sec-title{font-family:var(--f-d);font-size:clamp(1.3rem,3.8vw,1.75rem);font-weight:700;color:var(--i900);margin-bottom:1rem;line-height:1.35}
[data-theme="dark"] .sec-title{color:var(--g300)}
.sec p{font-size:1rem;color:var(--i700);line-height:1.9;margin-bottom:.9rem}
[data-theme="dark"] .sec p{color:var(--i500)}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem;margin-top:1rem}
.info-item{background:var(--i100);border-radius:var(--r-m);padding:1rem 1.2rem;border-right:3px solid #006233;transition:all .3s var(--e)}
[data-theme="dark"] .info-item{background:rgba(82,183,136,.05)}
.info-item:hover{transform:translateX(-4px)}
.info-label{font-family:var(--f-l);font-size:.75rem;color:var(--i400);letter-spacing:.05em;margin-bottom:.3rem}
.info-value{font-family:var(--f-d);font-size:1rem;color:var(--i900);font-weight:600}
[data-theme="dark"] .info-value{color:var(--g300)}

.items-list{list-style:none;padding:0;margin:1rem 0}
.items-list li{padding:.9rem 1.2rem;background:var(--i100);border-radius:var(--r-m);margin-bottom:.6rem;font-size:.96rem;color:var(--i700);line-height:1.8;border-right:3px solid var(--au500);transition:all .3s var(--e)}
[data-theme="dark"] .items-list li{background:rgba(82,183,136,.05);color:var(--i500)}
.items-list li:hover{transform:translateX(-4px);border-right-color:#006233}

.dua-box{background:linear-gradient(135deg,rgba(0,98,51,.1),rgba(210,16,52,.06));border:2px solid #006233;border-radius:var(--r-l);padding:1.5rem;margin-top:1.2rem}
.dua-box .dua-item{padding:.7rem 1rem;margin-bottom:.5rem;background:var(--paper);border-radius:var(--r-m);font-family:var(--f-q);font-size:1.05rem;line-height:1.9;color:var(--g800);border-right:3px solid var(--au500)}
[data-theme="dark"] .dua-box .dua-item{background:rgba(24,34,27,.6);color:var(--g200)}

.quote-box{text-align:center;padding:2rem 1.5rem;background:linear-gradient(135deg,#006233,#0a4a2a);border-radius:var(--r-xl);margin:2rem 0;color:#fff;position:relative;overflow:hidden}
.quote-box::before{content:'"';position:absolute;top:-30px;right:20px;font-family:var(--f-q);font-size:10rem;opacity:.1;line-height:1}
.quote-box .quote-text{font-family:var(--f-q);font-size:clamp(1.2rem,3vw,1.5rem);line-height:2;position:relative;z-index:1}
.quote-box .quote-ref{font-family:var(--f-l);font-size:.85rem;color:#e6c988;margin-top:1rem;letter-spacing:.05em}

.final-dua{text-align:center;font-family:var(--f-q);font-size:1.15rem;color:var(--g700);margin:2rem 0;line-height:1.9}
[data-theme="dark"] .final-dua{color:var(--g400)}

@media(max-width:600px){
  .info-grid{grid-template-columns:1fr}
}

/* ═══ Theme & Layout Overrides ═══ */
:root{ --f-body:'Tajawal',system-ui,sans-serif; }
body, p, li, .text, .card, .section { font-family: var(--f-body) !important; }
section, .container, .card { padding-left: 1.2rem; padding-right: 1.2rem; }
p, li { line-height: 1.9; margin-bottom: 1rem; }
.footnotes { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .9rem; color: var(--ink-3); }
.footnotes ol { padding-right: 1.2rem; }
.footnotes li { margin-bottom: .5rem; }
@media (max-width: 768px) {
  html { font-size: 15px; }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  .container { padding-left: 1rem; padding-right: 1rem; }
  .grid { grid-template-columns: 1fr !important; }
}
[data-theme="dark"] {
  --paper: #0f1f17;
  --bg: #0a1510;
  --bg-2: #12241b;
  --ink: #e8f0ec;
  --ink-2: #d0ddd6;
  --ink-3: #a0b0a8;
  --line: #1e3328;
}
[data-theme="dark"] body { background: var(--bg); color: var(--ink); }
[data-theme="dark"] .card, [data-theme="dark"] section { background: var(--paper); border-color: var(--line); }

<script>
(function(){
  var s=localStorage.getItem('theme');
  var d=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));
  document.getElementById('themeToggle').addEventListener('click',function(){
    var c=document.documentElement.getAttribute('data-theme');
    var n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  });

  var LANGS = {ar:'🇩🇿 العربية', en:'🇬🇧 English'};
  var bar = document.querySelector('.lang-bar');
  if(bar && !document.getElementById('dzLangSelect')){
    var sel = document.createElement('select');
    sel.id = 'dzLangSelect';
    sel.className = 'lang-select';
    Object.keys(LANGS).forEach(function(c){
      var o = document.createElement('option');
      o.value = c; o.textContent = LANGS[c];
      sel.appendChild(o);
    });
    sel.value = localStorage.getItem('lang') || 'ar';
    sel.addEventListener('change', function(){
      localStorage.setItem('lang', this.value);
      window.applyAlgeriaI18n();
    });
    var firstA = bar.querySelector('a');
    if(firstA) bar.insertBefore(sel, firstA);
    else bar.appendChild(sel);
  }

  window.applyAlgeriaI18n();
})();
</script>
