<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم · The Holy Quran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --em-900:#063d24;--em-800:#0a4a2d;--em-700:#0d5c3a;--em-600:#1a7a4f;
  --em-500:#2d8f5f;--em-400:#52b788;--em-300:#95d5b2;--em-200:#b7e4c7;--em-100:#d8f3dc;--em-50:#f0fdf4;
  --gd-900:#4a3413;--gd-700:#a67c3c;--gd-600:#c9a961;--gd-500:#d4b878;
  --gd-400:#e6c988;--gd-300:#f0dba8;--gd-200:#f4e4bc;--gd-100:#faf2dc;
  --ink:#0f1f17;--ink-2:#1a2e23;--ink-3:#5a6b62;--ink-4:#8a9691;--ink-5:#b8bfbb;
  --line:#e3e7e5;--paper:#fff;--bg:#fafaf7;
  --r-lg:32px;--r-xl:44px;--r-pill:999px;
  --sh-md:0 8px 24px rgba(13,40,24,.08);
  --sh-lg:0 20px 48px rgba(13,40,24,.12);
  --sh-xl:0 32px 80px rgba(13,40,24,.16);
  --f-quran:'Amiri',serif;
  --f-display:'Reem Kufi',serif;
  --f-body:'Tajawal',system-ui,sans-serif;
  --f-latin:'Inter',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-body);background:var(--bg);color:var(--ink-2);
  line-height:1.75;min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60% 50% at 15% 0%,rgba(82,183,136,.14) 0%,transparent 60%),
    radial-gradient(50% 40% at 85% 20%,rgba(201,169,97,.1) 0%,transparent 60%);
}
.header{
  position:sticky;top:0;z-index:100;padding:.75rem 0;
  background:rgba(250,250,247,.85);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(201,169,97,.2);
}
.header-inner{
  max-width:1200px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.brand{display:flex;align-items:center;gap:.7rem;color:var(--em-700);text-decoration:none}
.brand-logo{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--em-600),var(--em-800));
  display:flex;align-items:center;justify-content:center;
  color:var(--gd-300);font-size:1.5rem;
  box-shadow:0 8px 20px rgba(6,61,36,.3),inset 0 1px 0 rgba(230,201,136,.3);
  position:relative;
}
.brand-logo::before{content:'';position:absolute;inset:3px;border-radius:11px;border:1px solid rgba(230,201,136,.3)}
.brand-text{display:flex;flex-direction:column;line-height:1.15;font-family:var(--f-display)}
.brand-text .ar{font-size:1.1rem;font-weight:700}
.brand-text .en{font-family:var(--f-latin);font-size:.6rem;color:var(--ink-4);letter-spacing:.15em;text-transform:uppercase;font-weight:600}
.back-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.7rem 1.3rem;
  background:linear-gradient(135deg,var(--em-600),var(--em-800));
  color:#fff;border-radius:var(--r-pill);
  font-family:var(--f-body);font-size:.9rem;font-weight:700;
  text-decoration:none;
  transition:all .3s var(--ease);
  box-shadow:0 8px 20px rgba(13,92,58,.3);
}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(13,92,58,.4)}
.back-btn svg{width:16px;height:16px}
.container{max-width:1200px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
.iframe-wrap{
  border-radius:var(--r-xl);
  overflow:hidden;
  border:2px solid rgba(230,201,136,.4);
  box-shadow:var(--sh-xl);
  height:85vh;
  min-height:600px;
  margin:1.5rem 0 3rem;
  background:var(--paper);
}
.iframe-wrap iframe{
  width:100%;height:100%;border:none;display:block;
}
.footer{
  text-align:center;padding:2rem 1rem;
  color:var(--ink-4);font-size:.85rem;
  border-top:1px solid rgba(201,169,97,.2);
}
.footer-owner{font-family:var(--f-display);color:var(--ink-3);margin-top:.5rem}
.footer-owner strong{color:var(--gd-700)}

/* ═══ Theme & Layout Overrides ═══ */
:root{ --f-body:'Tajawal',system-ui,sans-serif; }
body, p, li, .text, .card, .section { font-family: var(--f-body) !important; }
section, .container, .card { padding-left: 1.2rem; padding-right: 1.2rem; }
p, li { line-height: 1.9; margin-bottom: 1rem; }
.footnotes { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .9rem; color: var(--ink-3); }
.footnotes ol { padding-right: 1.2rem; }
.footnotes li { margin-bottom: .5rem; }
@media (max-width: 768px) {
  html { font-size: 15px; }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  .container { padding-left: 1rem; padding-right: 1rem; }
  .grid { grid-template-columns: 1fr !important; }
}
[data-theme="dark"] {
  --paper: #0f1f17;
  --bg: #0a1510;
  --bg-2: #12241b;
  --ink: #e8f0ec;
  --ink-2: #d0ddd6;
  --ink-3: #a0b0a8;
  --line: #1e3328;
}
[data-theme="dark"] body { background: var(--bg); color: var(--ink); }
[data-theme="dark"] .card, [data-theme="dark"] section { background: var(--paper); border-color: var(--line); }

</style>
