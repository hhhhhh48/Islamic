<style>
.hj-hero{text-align:center;padding:3rem 1rem 2rem;position:relative;z-index:2;background:radial-gradient(circle at center,rgba(82,183,136,.10),transparent 70%);border-radius:var(--r-xl);margin-bottom:2rem}
.hj-hero .arab{font-family:var(--f-q);font-size:2.5rem;color:var(--au500);opacity:.7;margin-bottom:1rem}
.hj-hero h1{font-family:var(--f-d);font-size:clamp(1.9rem,5.5vw,3rem);font-weight:700;background:linear-gradient(135deg,var(--g700),var(--au500));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.hj-hero .en-sub{font-family:var(--f-l);font-size:.85rem;color:var(--i400);letter-spacing:.15em;direction:ltr;margin-bottom:1.5rem}
.hj-hero .verse{font-family:var(--f-q);font-size:clamp(1rem,2.7vw,1.2rem);color:var(--g800);line-height:2;max-width:720px;margin:0 auto 1rem;padding:1.3rem;background:var(--g50);border-radius:var(--r-m);border-right:4px solid var(--g500)}
[data-theme="dark"] .hj-hero .verse{background:rgba(82,183,136,.08);color:var(--g200)}
.hj-hero .intro{font-size:1rem;color:var(--i600);line-height:1.9;max-width:680px;margin:1rem auto 0}
[data-theme="dark"] .hj-hero .intro{color:var(--i500)}

.sec{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-xl);padding:clamp(1.6rem,4.5vw,2.6rem);margin-bottom:1.8rem;box-shadow:var(--sh-md);scroll-margin-top:80px}
[data-theme="dark"] .sec{border-color:rgba(82,183,136,.12)}
.sec-title{font-family:var(--f-d);font-size:clamp(1.3rem,3.8vw,1.75rem);font-weight:700;color:var(--i900);margin-bottom:1rem;line-height:1.35}
[data-theme="dark"] .sec-title{color:var(--g300)}

.toc{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-l);padding:1.5rem;margin-bottom:2rem;box-shadow:var(--sh-md)}
[data-theme="dark"] .toc{border-color:rgba(82,183,136,.15)}
.toc-title{font-family:var(--f-d);font-size:1rem;color:var(--g700);margin-bottom:.8rem;font-weight:600}
.toc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.4rem}
.toc-list a{color:var(--i600);text-decoration:none;font-size:.9rem;padding:.4rem .7rem;border-radius:var(--r-s);transition:all .3s var(--e);display:block}
.toc-list a:hover{background:var(--g50);color:var(--g700)}

.dual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.info-card{background:var(--i100);border-radius:var(--r-m);padding:1.3rem;border-right:4px solid var(--g500)}
[data-theme="dark"] .info-card{background:rgba(82,183,136,.06)}
.info-card .ic-title{font-family:var(--f-d);font-size:1.1rem;font-weight:700;color:var(--g800);margin-bottom:.7rem}
[data-theme="dark"] .info-card .ic-title{color:var(--g300)}
.info-card .ic-text{font-size:.95rem;color:var(--i700);line-height:1.9}
[data-theme="dark"] .info-card .ic-text{color:var(--i500)}

.items-list{list-style:none;padding:0;margin:1rem 0}
.items-list li{padding:.85rem 1.1rem;background:var(--i100);border-radius:var(--r-m);margin-bottom:.5rem;font-size:.95rem;color:var(--i700);line-height:1.85;border-right:3px solid var(--g400);transition:all .3s var(--e);white-space:pre-line}
[data-theme="dark"] .items-list li{background:rgba(82,183,136,.05);color:var(--i500)}
.items-list li:hover{transform:translateX(-4px);border-right-color:var(--au500)}
.items-list.haram li{border-right-color:#e57373;background:rgba(229,115,115,.06)}
[data-theme="dark"] .items-list.haram li{background:rgba(229,115,115,.1)}

.steps-timeline{position:relative;padding-right:2rem;margin:1.5rem 0}
.steps-timeline::before{content:'';position:absolute;right:8px;top:10px;bottom:10px;width:3px;background:linear-gradient(180deg,var(--g500),var(--au500))}
.steps-timeline li{list-style:none;position:relative;padding:1rem 1.5rem;background:var(--i100);border-radius:var(--r-m);margin-bottom:.8rem;font-size:.95rem;color:var(--i700);line-height:1.85}
[data-theme="dark"] .steps-timeline li{background:rgba(82,183,136,.05);color:var(--i500)}
.steps-timeline li::before{content:'';position:absolute;right:-1.55rem;top:1.2rem;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--g500),var(--g700));border:3px solid var(--paper);box-shadow:0 0 0 2px var(--g500)}
[data-theme="dark"] .steps-timeline li::before{border-color:var(--cream)}

.dua-card{background:linear-gradient(135deg,var(--g50),rgba(201,169,97,.06));border-right:4px solid var(--au500);border-radius:var(--r-m);padding:1.2rem 1.5rem;margin-bottom:.8rem}
[data-theme="dark"] .dua-card{background:rgba(82,183,136,.08)}
.dua-card .dc-title{font-family:var(--f-d);font-size:1rem;font-weight:700;color:var(--g800);margin-bottom:.5rem}
[data-theme="dark"] .dua-card .dc-title{color:var(--g300)}
.dua-card .dc-text{font-family:var(--f-q);font-size:1.05rem;line-height:2;color:var(--g800)}
[data-theme="dark"] .dua-card .dc-text{color:var(--g200)}

.tips-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem;margin-top:1rem}
.tip-card{background:var(--i100);border-radius:var(--r-m);padding:.9rem 1.1rem;font-size:.92rem;color:var(--i700);border-right:3px solid var(--au500);transition:all .3s var(--e)}
[data-theme="dark"] .tip-card{background:rgba(82,183,136,.05);color:var(--i500)}
.tip-card:hover{transform:translateX(-3px);border-right-color:var(--g500)}

.final-note{background:linear-gradient(135deg,rgba(201,169,97,.15),rgba(201,169,97,.08));border:1.5px solid var(--au400);border-radius:var(--r-m);padding:1.2rem 1.5rem;margin-top:1.5rem;font-size:.92rem;color:var(--i700);line-height:1.8;text-align:center}
[data-theme="dark"] .final-note{color:var(--i500)}

/* ═══ Theme & Layout Overrides ═══ */
:root{ --f-body:'Tajawal',system-ui,sans-serif; }
body, p, li, .text, .card, .section { font-family: var(--f-body) !important; }
section, .container, .card { padding-left: 1.2rem; padding-right: 1.2rem; }
p, li { line-height: 1.9; margin-bottom: 1rem; }
.footnotes { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .9rem; color: var(--ink-3); }
.footnotes ol { padding-right: 1.2rem; }
.footnotes li { margin-bottom: .5rem; }
@media (max-width: 768px) {
  html { font-size: 15px; }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  .container { padding-left: 1rem; padding-right: 1rem; }
  .grid { grid-template-columns: 1fr !important; }
}
[data-theme="dark"] {
  --paper: #0f1f17;
  --bg: #0a1510;
  --bg-2: #12241b;
  --ink: #e8f0ec;
  --ink-2: #d0ddd6;
  --ink-3: #a0b0a8;
  --line: #1e3328;
}
[data-theme="dark"] body { background: var(--bg); color: var(--ink); }
[data-theme="dark"] .card, [data-theme="dark"] section { background: var(--paper); border-color: var(--line); }

</style>

<script>
(function(){
  var s=localStorage.getItem('theme');
  var d=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));
  document.getElementById('themeToggle').addEventListener('click',function(){
    var c=document.documentElement.getAttribute('data-theme');
    var n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  });

  var LANGS = {ar:'🇸🇦 العربية', en:'🇬🇧 English'};
  var bar = document.querySelector('.lang-bar');
  if(bar && !document.getElementById('hjLangSelect')){
    var sel = document.createElement('select');
    sel.id = 'hjLangSelect';
    sel.className = 'lang-select';
    Object.keys(LANGS).forEach(function(c){
      var o = document.createElement('option');
      o.value = c; o.textContent = LANGS[c];
      sel.appendChild(o);
    });
    sel.value = localStorage.getItem('lang') || 'ar';
    sel.addEventListener('change', function(){
      localStorage.setItem('lang', this.value);
      window.applyHajjI18n();
    });
    var firstA = bar.querySelector('a');
    if(firstA) bar.insertBefore(sel, firstA);
    else bar.appendChild(sel);
  }

  window.applyHajjI18n();

  document.querySelectorAll('.toc-list a').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var t = document.querySelector(this.getAttribute('href'));
      if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
})();
</script>
</body>
</html>
