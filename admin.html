<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin · لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g900:#0d2818;--g800:#1b4332;--g700:#2d6a4f;--g600:#40916c;--g500:#52b788;--g400:#74c69d;--g300:#95d5b2;--g200:#b7e4c7;--g100:#d8f3dc;--g50:#f0fdf4;
  --au600:#a67c3c;--au500:#c9a961;--au400:#e6c988;--au200:#f4e4bc;
  --cream:#fafaf7;--paper:#fff;
  --i900:#0f1f17;--i800:#1a2e23;--i700:#2c3e35;--i500:#5a6b62;--i400:#8a9691;--i300:#b8bfbb;--i200:#e3e7e5;--i100:#f2f4f3;
  --red:#e57373;--red-dark:#c62828;
  --r-s:14px;--r-m:22px;--r-l:32px;--r-pill:999px;
  --sh-md:0 8px 24px rgba(13,40,24,.07);--sh-lg:0 24px 56px rgba(13,40,24,.10);
  --f-d:'Reem Kufi','Amiri',serif;--f-b:'Cairo',system-ui,sans-serif;--f-l:'Inter',system-ui,sans-serif;
  --e:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --cream:#080d0a;--paper:#0f1712;
  --i900:#f5f7f6;--i800:#e8ede9;--i700:#cdd5cf;--i500:#9aa89f;--i400:#6b7a71;--i300:#3d4a42;--i200:#253029;--i100:#161d18;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--f-b);background:var(--cream);color:var(--i800);line-height:1.7;min-height:100vh;transition:background .5s var(--e),color .5s var(--e)}

/* Login Screen */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(135deg,var(--g800),var(--g900))}
.login-box{background:var(--paper);border-radius:var(--r-l);padding:2.5rem 2rem;max-width:420px;width:100%;box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:0;left:15%;right:15%;height:3px;background:linear-gradient(90deg,transparent,var(--au500),transparent)}
.login-icon{width:72px;height:72px;margin:0 auto 1.2rem;background:linear-gradient(135deg,var(--g100),var(--g200));border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--g700)}
.login-icon svg{width:36px;height:36px}
.login-box h1{font-family:var(--f-d);font-size:1.6rem;font-weight:700;color:var(--i900);text-align:center;margin-bottom:.4rem}
.login-box .sub{text-align:center;color:var(--i500);font-size:.85rem;margin-bottom:2rem;font-family:var(--f-l);direction:ltr}
.login-box label{display:block;font-size:.8rem;font-weight:600;color:var(--i700);margin-bottom:.4rem;font-family:var(--f-l);letter-spacing:.03em}
.login-box input{width:100%;padding:.9rem 1.1rem;background:var(--i100);border:1.5px solid transparent;border-radius:var(--r-s);font-family:var(--f-b);font-size:1rem;color:var(--i900);margin-bottom:1.1rem;transition:all .3s var(--e);outline:none}
.login-box input:focus{border-color:var(--g500);background:var(--paper);box-shadow:0 0 0 4px rgba(82,183,136,.15)}
.login-box button{width:100%;padding:1rem;background:linear-gradient(135deg,var(--g600),var(--g700));color:#fff;border:none;border-radius:var(--r-pill);font-family:var(--f-b);font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s var(--e);box-shadow:0 12px 30px rgba(45,106,79,.3)}
.login-box button:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(45,106,79,.4)}
.login-box button:disabled{opacity:.6;cursor:wait;transform:none}
.error-msg{color:var(--red-dark);font-size:.85rem;text-align:center;margin-top:1rem;min-height:1.2rem;font-weight:600}
[data-theme="dark"] .error-msg{color:var(--red)}

/* Dashboard */
.dashboard{display:none;min-height:100vh;padding:1.5rem}
.dashboard.show{display:block}
.dash-header{max-width:1200px;margin:0 auto 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;padding-bottom:1rem;border-bottom:1px solid var(--i200)}
[data-theme="dark"] .dash-header{border-color:var(--i300)}
.dash-title{font-family:var(--f-d);font-size:1.6rem;color:var(--i900);font-weight:700}
.dash-title span{color:var(--g600);font-size:.9rem;display:block;font-family:var(--f-l);font-weight:500;margin-top:.2rem;direction:ltr}
.dash-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.btn{padding:.7rem 1.2rem;border:none;border-radius:var(--r-pill);font-family:var(--f-b);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .3s var(--e);display:inline-flex;align-items:center;gap:.5rem}
.btn svg{width:16px;height:16px}
.btn-refresh{background:var(--g100);color:var(--g800)}
.btn-refresh:hover{background:var(--g200)}
.btn-logout{background:var(--red);color:#fff}
.btn-logout:hover{background:var(--red-dark)}
.btn-theme{background:var(--i100);color:var(--i800);width:42px;height:42px;padding:0;justify-content:center}
[data-theme="dark"] .btn-theme{background:var(--i200)}

.container{max-width:1200px;margin:0 auto}

/* Stats cards */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-m);padding:1.5rem;position:relative;overflow:hidden;transition:all .3s var(--e)}
[data-theme="dark"] .stat-card{border-color:var(--i300)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g400),var(--au400))}
.stat-card.shahada::before{background:linear-gradient(90deg,var(--g500),var(--g700))}
.stat-card.visits::before{background:linear-gradient(90deg,var(--au400),var(--au600))}
.stat-label{font-family:var(--f-l);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--i400);margin-bottom:.5rem}
.stat-value{font-family:var(--f-d);font-size:2.8rem;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--i900);direction:ltr;text-align:right}
.stat-card.shahada .stat-value{background:linear-gradient(135deg,var(--g600),var(--g800));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-card.visits .stat-value{background:linear-gradient(135deg,var(--au500),var(--au600));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-sub{font-size:.8rem;color:var(--i400);margin-top:.4rem}

/* Table grid */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1.5rem;margin-bottom:2rem}
.panel{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-m);padding:1.5rem;box-shadow:var(--sh-md)}
[data-theme="dark"] .panel{border-color:var(--i300)}
.panel-title{font-family:var(--f-d);font-size:1.1rem;color:var(--i900);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;padding-bottom:.7rem;border-bottom:1px solid var(--i200)}
[data-theme="dark"] .panel-title{border-color:var(--i300)}
.panel-title .count{font-family:var(--f-l);font-size:.75rem;background:var(--g100);color:var(--g800);padding:.2rem .7rem;border-radius:var(--r-pill);font-weight:700;margin-right:auto}
[data-theme="dark"] .panel-title .count{background:var(--i200);color:var(--i700)}

/* Country rows */
.country-row{display:flex;align-items:center;gap:.7rem;padding:.7rem .6rem;border-radius:var(--r-s);transition:background .2s var(--e)}
.country-row:hover{background:var(--i100)}
[data-theme="dark"] .country-row:hover{background:var(--i200)}
.country-row .flag{font-size:1.5rem;line-height:1}
.country-row .name{flex:1;font-weight:600;color:var(--i800)}
.country-row .code{font-family:var(--f-l);font-size:.75rem;color:var(--i400);direction:ltr;padding:.15rem .5rem;background:var(--i100);border-radius:var(--r-s)}
[data-theme="dark"] .country-row .code{background:var(--i200)}
.country-row .cnt{font-family:var(--f-l);font-weight:700;color:var(--g700);font-size:1.05rem;direction:ltr;min-width:50px;text-align:left}
[data-theme="dark"] .country-row .cnt{color:var(--g400)}

/* Recent table */
.recent-table{width:100%;border-collapse:collapse;font-size:.88rem}
.recent-table th{text-align:right;font-family:var(--f-l);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--i400);padding:.6rem .5rem;border-bottom:1px solid var(--i200);font-weight:600}
[data-theme="dark"] .recent-table th{border-color:var(--i300)}
.recent-table td{padding:.7rem .5rem;border-bottom:1px solid var(--i100);color:var(--i700)}
[data-theme="dark"] .recent-table td{border-color:var(--i200);color:var(--i500)}
.recent-table td.name{font-weight:600;color:var(--i900)}
.recent-table td.date{font-family:var(--f-l);font-size:.78rem;color:var(--i400);direction:ltr;text-align:left}

.empty{text-align:center;padding:2rem 1rem;color:var(--i400);font-size:.9rem}

.update-time{text-align:center;font-family:var(--f-l);font-size:.8rem;color:var(--i400);direction:ltr;padding:1rem 0;margin-top:1rem}

/* Toast */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(150%);background:var(--g800);color:#fff;padding:1rem 1.8rem;border-radius:var(--r-pill);box-shadow:0 20px 50px rgba(13,40,24,.35);z-index:9999;font-weight:600;transition:transform .5s var(--e)}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  .stat-value{font-size:2.2rem}
  .panel{padding:1.2rem}
  .dash-header{padding:.5rem 0}
  .dash-title{font-size:1.3rem}
}
</style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>لوحة التحكم</h1>
    <div class="sub">ADMIN ACCESS ONLY</div>
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" placeholder="Mohamed ouachemi 7">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••">
    <button id="loginBtn">دخول</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-title">📊 لوحة التحكم<span>Admin Dashboard</span></div>
    <div class="dash-actions">
      <button class="btn btn-refresh" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        تحديث
      </button>
      <button class="btn btn-theme" id="themeBtn" title="تبديل المظهر">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn btn-logout" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        خروج
      </button>
    </div>
  </div>

  <div class="container">
    <div class="stats-row">
      <div class="stat-card shahada">
        <div class="stat-label">أسلموا · Shahadas</div>
        <div class="stat-value" id="totalShahadas">0</div>
        <div class="stat-sub">شخص نطق الشهادة</div>
      </div>
      <div class="stat-card visits">
        <div class="stat-label">الزيارات · Visits</div>
        <div class="stat-value" id="totalVisits">0</div>
        <div class="stat-sub">زيارة فريدة للموقع</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">الدول · Countries</div>
        <div class="stat-value" id="totalCountries">0</div>
        <div class="stat-sub">دولة مختلفة</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">نسبة الإسلام · Rate</div>
        <div class="stat-value" id="convRate">0%</div>
        <div class="stat-sub">زيارات ← شهادات</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">🕌 المسلمون الجدد حسب الدولة <span class="count" id="shahadaCountriesCount">0</span></div>
        <div id="shahadaCountriesList"></div>
      </div>
      <div class="panel">
        <div class="panel-title">🌍 الزوار حسب الدولة <span class="count" id="visitCountriesCount">0</span></div>
        <div id="visitCountriesList"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">📋 آخر الشهادات <span class="count" id="recentCount">0</span></div>
      <div id="recentList"></div>
    </div>

    <div class="update-time" id="updateTime">آخر تحديث: —</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const TOKEN_KEY = 'admin_token';
  let token = localStorage.getItem(TOKEN_KEY) || null;
  let refreshInterval = null;

  // Theme
  const savedTheme = localStorage.getItem('theme');
  document.documentElement.setAttribute('data-theme', savedTheme || 'light');
  document.getElementById('themeBtn').addEventListener('click', () => {
    const c = document.documentElement.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('theme', n);
  });

  // Helpers
  function flagEmoji(code) {
    if (!code || code.length !== 2 || code === 'UN') return '🌍';
    try { return String.fromCodePoint(...[...code.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)); }
    catch(e) { return '🌍'; }
  }
  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) + ' ' +
             d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    } catch(e) { return iso; }
  }
  function showToast(msg, isErr) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isErr ? '#c62828' : 'var(--g800)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Login
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    errEl.textContent = '';
    if (!username || !password) { errEl.textContent = 'املأ الحقلين'; return; }
    btn.disabled = true; btn.textContent = 'جاري التحقق...';
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (data.ok && data.token) {
        token = data.token;
        localStorage.setItem(TOKEN_KEY, token);
        showDashboard();
      } else {
        errEl.textContent = data.error || 'بيانات خاطئة';
        document.getElementById('password').value = '';
      }
    } catch (e) {
      errEl.textContent = 'تعذّر الاتصال بالسيرفر';
    }
    btn.disabled = false; btn.textContent = 'دخول';
  }

  async function checkAuth() {
    if (!token) return false;
    try {
      const r = await fetch('/api/admin/check', { headers: { Authorization: 'Bearer ' + token } });
      return r.ok;
    } catch { return false; }
  }

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    loadStats();
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(loadStats, 30000); // كل 30 ثانية
  }

  function showLogin() {
    document.getElementById('loginScreen').style.display = '';
    document.getElementById('dashboard').classList.remove('show');
    if (refreshInterval) clearInterval(refreshInterval);
  }

  async function loadStats() {
    if (!token) return;
    try {
      const r = await fetch('/api/admin/stats', { headers: { Authorization: 'Bearer ' + token } });
      if (r.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        token = null;
        showLogin();
        showToast('انتهت الجلسة', true);
        return;
      }
      const data = await r.json();
      render(data);
    } catch (e) { showToast('تعذّر التحديث', true); }
  }

  function render(data) {
    document.getElementById('totalShahadas').textContent = (data.total_shahadas || 0).toLocaleString('en-US');
    document.getElementById('totalVisits').textContent = (data.total_visits || 0).toLocaleString('en-US');
    document.getElementById('totalCountries').textContent = new Set([
      ...data.shahada_countries.map(c => c.code),
      ...data.visit_countries.map(c => c.code)
    ]).size;

    const rate = data.total_visits > 0 ? ((data.total_shahadas / data.total_visits) * 100).toFixed(1) : '0.0';
    document.getElementById('convRate').textContent = rate + '%';

    // Shahada countries
    const sc = document.getElementById('shahadaCountriesList');
    document.getElementById('shahadaCountriesCount').textContent = data.shahada_countries.length;
    if (!data.shahada_countries.length) {
      sc.innerHTML = '<div class="empty">لا توجد شهادات بعد 🤍</div>';
    } else {
      sc.innerHTML = data.shahada_countries.map(c =>
        '<div class="country-row">' +
          '<span class="flag">' + flagEmoji(c.code) + '</span>' +
          '<span class="name">' + c.country + '</span>' +
          '<span class="code">' + c.code + '</span>' +
          '<span class="cnt">' + c.cnt.toLocaleString('en-US') + '</span>' +
        '</div>'
      ).join('');
    }

    // Visit countries
    const vc = document.getElementById('visitCountriesList');
    document.getElementById('visitCountriesCount').textContent = data.visit_countries.length;
    if (!data.visit_countries.length) {
      vc.innerHTML = '<div class="empty">لا توجد زيارات بعد</div>';
    } else {
      vc.innerHTML = data.visit_countries.map(c =>
        '<div class="country-row">' +
          '<span class="flag">' + flagEmoji(c.code) + '</span>' +
          '<span class="name">' + c.country + '</span>' +
          '<span class="code">' + c.code + '</span>' +
          '<span class="cnt">' + c.cnt.toLocaleString('en-US') + '</span>' +
        '</div>'
      ).join('');
    }

    // Recent
    const rec = document.getElementById('recentList');
    document.getElementById('recentCount').textContent = (data.recent_shahadas || []).length;
    if (!data.recent_shahadas || !data.recent_shahadas.length) {
      rec.innerHTML = '<div class="empty">لا سجل بعد</div>';
    } else {
      rec.innerHTML =
        '<table class="recent-table">' +
          '<thead><tr><th>الاسم</th><th>الدولة</th><th>التاريخ</th></tr></thead><tbody>' +
          data.recent_shahadas.map(s =>
            '<tr>' +
              '<td class="name">' + escapeHtml(s.name) + '</td>' +
              '<td>' + flagEmoji(s.country_code) + ' ' + escapeHtml(s.country) + '</td>' +
              '<td class="date">' + formatDate(s.ts) + '</td>' +
            '</tr>'
          ).join('') +
        '</tbody></table>';
    }

    document.getElementById('updateTime').textContent = 'آخر تحديث: ' + formatDate(data.server_time);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
  }

  // Refresh btn
  document.getElementById('refreshBtn').addEventListener('click', () => { loadStats(); showToast('تم التحديث ✓'); });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await fetch('/api/admin/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }); } catch(e) {}
    localStorage.removeItem(TOKEN_KEY);
    token = null;
    showLogin();
    showToast('تم الخروج');
  });

  // Init
  (async function() {
    if (await checkAuth()) showDashboard();
    else showLogin();
  })();
})();
</script>
</body>
</html>
