<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصص الأنبياء · Stories of the Prophets</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.ph-hero{text-align:center;padding:3rem 1rem 2rem;position:relative;z-index:2;background:radial-gradient(circle at center,rgba(82,183,136,.10),transparent 70%);border-radius:var(--r-xl);margin-bottom:2rem}
.ph-hero .arab{font-family:var(--f-q);font-size:2.5rem;color:var(--au500);opacity:.7;margin-bottom:1rem}
.ph-hero h1{font-family:var(--f-d);font-size:clamp(1.9rem,5.5vw,3rem);font-weight:700;background:linear-gradient(135deg,var(--g700),var(--au500));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.ph-hero .en-sub{font-family:var(--f-l);font-size:.85rem;color:var(--i400);letter-spacing:.15em;direction:ltr;margin-bottom:1.5rem}
.ph-hero .intro{font-size:1rem;color:var(--i600);line-height:1.9;max-width:680px;margin:1rem auto 0}
[data-theme="dark"] .ph-hero .intro{color:var(--i500)}

.prophets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.9rem;margin-bottom:2rem}
.prophet-card{background:var(--paper);border:2px solid var(--i200);border-radius:var(--r-l);padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all .4s var(--e);box-shadow:var(--sh-sm);position:relative;overflow:hidden}
[data-theme="dark"] .prophet-card{border-color:rgba(82,183,136,.12)}
.prophet-card::before{content:'';position:absolute;top:0;left:15%;right:15%;height:3px;background:linear-gradient(90deg,transparent,var(--au500),transparent);opacity:0;transition:opacity .4s var(--e)}
.prophet-card:hover{transform:translateY(-6px);border-color:var(--g500);box-shadow:0 20px 45px rgba(45,106,79,.15)}
.prophet-card:hover::before{opacity:1}
.prophet-card.active{background:linear-gradient(135deg,var(--g700),var(--g800));border-color:var(--g600);color:#fff}
.prophet-card .p-icon{font-size:2.5rem;line-height:1;margin-bottom:.6rem;display:block}
.prophet-card .p-name{font-family:var(--f-d);font-size:1.1rem;font-weight:700;color:var(--g800);margin-bottom:.3rem}
[data-theme="dark"] .prophet-card .p-name{color:var(--g300)}
.prophet-card.active .p-name{color:#fff}
.prophet-card .p-title{font-size:.78rem;color:var(--i500);line-height:1.4}
.prophet-card.active .p-title{color:rgba(255,255,255,.8)}

.story-panel{background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-xl);padding:clamp(1.6rem,4.5vw,2.8rem);margin-bottom:1.8rem;box-shadow:var(--sh-lg);display:none}
[data-theme="dark"] .story-panel{border-color:rgba(82,183,136,.12)}
.story-panel.active{display:block;animation:fadeIn .5s var(--e)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.story-head{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:2px dashed var(--i200)}
[data-theme="dark"] .story-head{border-color:var(--i300)}
.story-icon{font-size:4rem;line-height:1;margin-bottom:1rem;display:block}
.story-name{font-family:var(--f-d);font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:700;color:var(--g800);margin-bottom:.3rem}
[data-theme="dark"] .story-name{color:var(--g300)}
.story-title{font-size:1rem;color:var(--au600);font-weight:600;margin-bottom:1rem}
.story-verse{font-family:var(--f-q);font-size:clamp(1rem,2.7vw,1.2rem);line-height:2;color:var(--g800);background:var(--g50);padding:1.2rem 1.5rem;border-radius:var(--r-m);border-right:4px solid var(--g500);margin-top:1rem;max-width:700px;margin-left:auto;margin-right:auto}
[data-theme="dark"] .story-verse{background:rgba(82,183,136,.08);color:var(--g200)}
.story-verse .v-ref{font-family:var(--f-l);font-size:.75rem;color:var(--au600);display:block;margin-top:.5rem;text-align:right}
[data-theme="dark"] .story-verse .v-ref{color:var(--au400)}

.story-sections{display:flex;flex-direction:column;gap:1rem}
.story-section{background:var(--i100);border-radius:var(--r-m);padding:1.3rem 1.5rem;border-right:3px solid var(--g500);transition:all .3s var(--e)}
[data-theme="dark"] .story-section{background:rgba(82,183,136,.05)}
.story-section:hover{transform:translateX(-4px);border-right-color:var(--au500)}
.story-section .ss-title{font-family:var(--f-d);font-size:1.1rem;font-weight:700;color:var(--g800);margin-bottom:.6rem}
[data-theme="dark"] .story-section .ss-title{color:var(--g300)}
.story-section .ss-text{font-size:.98rem;color:var(--i700);line-height:1.95;white-space:pre-line}
[data-theme="dark"] .story-section .ss-text{color:var(--i500)}

.nav-buttons{display:flex;gap:.6rem;justify-content:center;margin-top:2rem;flex-wrap:wrap}
.nav-btn{padding:.8rem 1.5rem;background:var(--paper);border:1.5px solid var(--i200);border-radius:var(--r-pill);font-family:var(--f-b);font-size:.9rem;font-weight:600;color:var(--i700);cursor:pointer;transition:all .3s var(--e)}
[data-theme="dark"] .nav-btn{background:rgba(24,34,27,.5);border-color:var(--i300);color:var(--i500)}
.nav-btn:hover{border-color:var(--g500);background:var(--g50);color:var(--g800)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>
<body>

<div class="lang-bar">
  <a href="index.html" style="text-decoration:none;padding:.6rem 1.1rem;background:var(--paper);border:1px solid var(--i200);border-radius:var(--r-pill);color:var(--i800);font-family:var(--f-b);font-size:.85rem;font-weight:600;box-shadow:var(--sh-md)">🏠 الرئيسية</a>
</div>
<button class="theme-toggle" id="themeToggle">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>

<main class="container">

<section class="ph-hero">
  <div class="arab">﷽</div>
  <h1>قصص الأنبياء</h1>
  <div class="en-sub">Stories of the Prophets</div>
  <div class="intro">رحلة عبر الزمن مع أعظم من وطئت أقدامهم الأرض — من آدم إلى محمد ﷺ. قصص فيها العبر، والدروس، والأمل.</div>
</section>

<div class="prophets-grid" id="prophetsGrid"></div>

<div id="storyPanelWrap"></div>

<div class="nav-buttons">
  <button class="nav-btn" id="prevBtn">← السابق</button>
  <button class="nav-btn" id="nextBtn">التالي →</button>
</div>

<footer class="footer">
  <div class="footer-dua">اللهم اجعلنا من أتباع أنبيائك، واحشرنا معهم</div>
  <div class="footer-owner">صاحب الموقع: <strong>واشمي محمد</strong></div>
</footer>

</main>

<div class="share-container"></div>

<script src="prophets-data.js"></script>
<script src="share.js"></script>
<script>
(function(){
  var s=localStorage.getItem('theme');
  var d=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));
  document.getElementById('themeToggle').addEventListener('click',function(){
    var c=document.documentElement.getAttribute('data-theme');
    var n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  });

  var PROPHETS = window.PROPHETS || [];
  var currentIdx = 0;

  function renderGrid(){
    var grid = document.getElementById('prophetsGrid');
    grid.innerHTML = '';
    PROPHETS.forEach(function(p, i){
      var card = document.createElement('div');
      card.className = 'prophet-card' + (i === currentIdx ? ' active' : '');
      card.innerHTML =
        '<span class="p-icon">' + p.icon + '</span>' +
        '<div class="p-name">' + p.name_ar + '</div>' +
        '<div class="p-title">' + p.title_ar + '</div>';
      card.addEventListener('click', function(){
        currentIdx = i;
        renderGrid();
        renderStory();
      });
      grid.appendChild(card);
    });
  }

  function renderStory(){
    var wrap = document.getElementById('storyPanelWrap');
    var p = PROPHETS[currentIdx];
    if (!p) return;

    var sections = p.sections_ar || [];
    var sectionsHTML = sections.map(function(sec){
      return '<div class="story-section">' +
        '<div class="ss-title">' + sec.title + '</div>' +
        '<div class="ss-text">' + sec.text + '</div>' +
      '</div>';
    }).join('');

    wrap.innerHTML =
      '<article class="story-panel active">' +
        '<div class="story-head">' +
          '<span class="story-icon">' + p.icon + '</span>' +
          '<div class="story-name">' + p.name_ar + '</div>' +
          '<div class="story-title">' + p.title_ar + '</div>' +
          '<div class="story-verse">' + p.verse + '<span class="v-ref">' + p.verse_ref + '</span></div>' +
        '</div>' +
        '<div class="story-sections">' + sectionsHTML + '</div>' +
      '</article>';

    // update nav buttons
    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').disabled = currentIdx === PROPHETS.length - 1;

    wrap.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  document.getElementById('prevBtn').addEventListener('click', function(){
    if (currentIdx > 0) {
      currentIdx--;
      renderGrid();
      renderStory();
    }
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    if (currentIdx < PROPHETS.length - 1) {
      currentIdx++;
      renderGrid();
      renderStory();
    }
  });

  renderGrid();
  renderStory();
})();
</script>
</body>
</html>
